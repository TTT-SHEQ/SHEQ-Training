<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองอบรมความปลอดภัยสำหรับผู้รับเหมาใหม่</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <header class="bg-slate-900 text-white border-b-4 border-blue-500 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <!-- ปรับลิงก์ถอยกลับเป็น ../ -->
        <a href="../" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors" title="กลับหน้าแรก">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="bg-blue-600 text-white p-2.5 rounded-lg">
          <i data-lucide="user-plus" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">อบรมความปลอดภัยเบื้องต้นสำหรับผู้รับเหมาใหม่</h1>
          <p class="text-xs text-slate-300">New Contractor Safety Induction</p>
        </div>
      </div>
      <!-- ปรับลิงก์ถอยกลับเป็น ../ -->
      <a href="../" class="text-xs text-blue-300 hover:text-white flex items-center gap-1.5 border border-slate-700 px-3.5 py-1.5 rounded-full bg-slate-800/80 transition-colors">
        <i data-lucide="home" class="w-3.5 h-3.5"></i> กลับหน้าหลัก
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-16 flex-1 w-full text-center space-y-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-lg mx-auto">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="calendar-clock" class="w-8 h-8"></i>
      </div>
      <h2 class="text-lg font-bold text-slate-900 mb-2">หน้าจองสำหรับผู้รับเหมาใหม่</h2>
      <p class="text-xs text-slate-500 mb-6 leading-relaxed">
        ไฟล์นี้แยกออกมาพร้อมให้คุณกำหนด วัน/เวลา จำนวนที่นั่ง และช่องอัปโหลดเอกสารเฉพาะของผู้รับเหมาใหม่ได้ทันที
      </p>
      <!-- ปรับลิงก์ถอยกลับเป็น ../ -->
      <a href="../" class="inline-flex items-center gap-2 bg-slate-900 text-white text-xs px-5 py-3 rounded-xl hover:bg-slate-800 shadow transition-colors">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> กลับไปเลือกหลักสูตรอื่น
      </a>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
